<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio Web</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Directorio Web</h1>
    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#usuarios">Usuarios</a></li>
        <li><a href="#acerca">Acerca de</a></li>
      </ul>
    </nav>
  </header>

  <main id="inicio">
    <section id="usuarios" class="usuarios" aria-labelledby="titulo-usuarios">
      <h2 id="titulo-usuarios">Usuarios registrados</h2>

      <form class="formulario-busqueda" role="search">
        <label for="buscar">Buscar usuario</label>
        <input id="buscar" name="buscar" type="search" placeholder="Escriba un nombre...">
        <button id="limpiar" type="button">Limpiar búsqueda</button>
      </form>

      <p id="mensaje" role="status" aria-live="polite">Cargando usuarios...</p>
      <div id="contenedorUsuarios" class="contenedor-usuarios"></div>
    </section>

    <section id="acerca" class="acerca" aria-labelledby="titulo-acerca">
      <h2 id="titulo-acerca">Acerca de</h2>
      <p>Miniaplicación académica para practicar HTML, CSS, JavaScript y Fetch API.</p>
    </section>
  </main>

  <footer>
    <p>Programación Web</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
